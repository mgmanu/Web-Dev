    
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Signup - Sports Arena</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .signup-box {
            width: 400px;
            max-width: 90%;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .signup-box h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #222;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: green;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            text-decoration: none;
            color: blue;
        }

    </style>

</head>

<body>

    <header>
        <h1>Sports Arena</h1>
    </header>


    <div class="signup-box">

        <h2>Signup</h2>

        <form>

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >


            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                required
            >


            <label for="mobile">
                Mobile
            </label>

            <input
                type="tel"
                id="mobile"
                name="mobile"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >


            <button type="submit">
                Submit
            </button>

        </form>


        <div class="back">

            <a href="index.html">
                Back to Home
            </a>

        </div>

    </div>

</body>

</html>
