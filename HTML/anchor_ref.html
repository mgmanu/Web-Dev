<head>

    <title>Redirect</title>
</head>
<body>
    <a href="https://www.google.com">Same tab : Google</a>

    <br>

    <br>
    <a href="https://www.google.com" target="_blank" 
    title="Goes to google">Click Here</a> <!-- When hover , a small 
    box appears named Goes to google-->

    <br> 
    <a href="lyrics.html">Song Name : Espresso</a>
    <br>
    <br>
    <a href="lyrics.html" target="_blank">Song Name : Espresso in NEW tab</a>

    <br>
    <a href="mailto:example@example.com">Go to Email</a>
</body>
</html>
