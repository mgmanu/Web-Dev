<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImagesAudios</title>
</head>
<body>
    <h1>Monkey Selfie</h1>
    <a href="https://en.wikipedia.org/wiki/Monkey" target="_blank">
    <img src="images_videos_audios/Monkey-Selfie.webp" 
    alt="Monkey image" width="200" height="200">
    </a> <!-- When click on the image it will redirect to the wikipedia page of monkey -->
    <br>
    <br>
    <h1>Audio</h1>
    <p>Kalyani</p>
    <audio controls autoplay muted loop>
        <source src="images_videos_audios/Kalyani - 320k(DJMaza).mp3" >
    </audio>
    <!-- when loop then the audio will play continuously -->
    <!-- The audio will play automatically when the page loads, but it will be muted. The user can unmute it using the controls. -->
    <!-- only autoplay then it will play automatically when the page loads, but the user can unmute it using the controls. -->
    <br>
    <br>
    <p>Boom Shaka</p>
    <audio controls>
        <source src="images_videos_audios/Boom Shaka - 128k .mp3" >
    </audio>
    <br>
    <br>
    <h1>Video</h1>
    <video controls autoplay muted loop>
        <source src="images_videos_audios/Monkey.mp4" type="video/mp4">
    </video>

    <br>
    <br>
    <video src="images_videos_audios/Monkey.mp4" type="video/mp4" 
    controls autoplay muted loop>
    </video>
</body>
</html>
