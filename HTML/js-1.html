<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulb ON OFF</title>
</head>

<body>

    <h1>My First JS</h1>

    <h2>JavaScript can change HTML content</h2>

    <p>
        In this example JavaScript changes the value of the
        src (source) attribute of an &lt;img&gt; tag.
    </p>

    <button onclick="document.getElementById('myImage').src='images_videos_audios/pic_bulbon.gif'">
        Turn ON the light
    </button>

    <img id="myImage" src="images_videos_audios/pic_bulboff.gif" style="width:100px">

    <button onclick="document.getElementById('myImage').src='images_videos_audios/pic_bulboff.gif'">
        Turn OFF the light
    </button>

    
    <h2>Javascript can change HTML Styles (CSS)</h2>

    
    
</body>
</html>
