<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modal Popup</title>

    <style>

        #openBtn {
            background-color: rgb(18, 152, 197);
            color: white;
            border: none;
            border-radius: 25px;
            height: 50px;
            width: 105px;
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
            margin-left: 10px;
            transition: box-shadow 0.5s, opacity 1s;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .modal-box {
            background: white;
            width: 90%;
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 10px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            right: 12px;
            top: 8px;
            font-size: 24px;
            border: none;
            background: none;
            cursor: pointer;
        }

        .modal-overlay.show {
            display: block;
        }

        #openBtn:hover {
            box-shadow: 10px 10px 7px rgba(0, 0, 0, 0.404);
        }

        #openBtn:active {
            opacity: 0.7;
        }

    </style>

</head>

<body>

    <h1>Modal Popup</h1>

    <button id="openBtn">Open Modal</button>

    <div id="modal" class="modal-overlay">

        <div class="modal-box">

            <button id="closeBtn" class="modal-close">x</button>

            <h3>Hello!</h3>

            <p>This is a modal popup.</p>

        </div>

    </div>

    <script>

        const modal = document.getElementById("modal");
        const openBtn = document.getElementById("openBtn");
        const closeBtn = document.getElementById("closeBtn");

        function openModal() {
            modal.classList.add("show");
        }

        function closeModal() {
            modal.classList.remove("show");
        }

        openBtn.addEventListener("click", openModal);

        closeBtn.addEventListener("click", closeModal);

        modal.addEventListener("click", function(event) {

            if (event.target === modal) {
                closeModal();
            }

        });

        modal.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {
                closeModal();
            }

        });
        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                closeModal();
        }
});

    </script>

</body>

</html>
