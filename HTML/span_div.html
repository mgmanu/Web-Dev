<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span & Div</title>
</head>
<body>
    <h1><mark style="color: aqua;">This is a dummy text</mark></h1>
    <h1><span style="color: aqua;">
        This is a dummy text</span></h1>
    <h1><div style="background-color: aqua;">
        This is a dummy text</div></h1>
</body>
</html>
