<style>
    .subscribe-button{
        background-color: rgb(200, 0, 0);
        color: white;
        border: none;
        /* height: 50px;
        width: 105px; */
        /* Best alternative */
        padding-bottom:15px ;
        padding-left:15px ;
        padding-right:15px ;
        padding-top:15px ;
        border-radius: 5px;
        cursor: pointer;
        margin-right: 10px;
        transition: opacity 1s;
    }
    
    .join-button{
        background-color: white;
        border-color: rgb(42, 87, 236);
        border-style: solid;
        border-width: 2px;
        color: rgb(42,87,236);
        height: 50px;
        width: 75px;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 1s,color 1s,opacity 1.2s;
    }
    
    .tweet-button{
        background-color: rgb(18, 152, 197);
        color: white;
        border: none;
        border-radius: 25px;
        height:50px;
        width:105px;
        cursor: pointer;
        font-weight: bold;
        font-size: 20px;
        margin-left: 10px;
        transition: box-shadow 0.5s,opacity 1s;
    }

    .stretch-button{
        background-color: green;
        color:white;
        border:none;
        padding-top: 8px;
        padding-bottom: 8px;
        padding-left: 15px;
        padding-right: 15px;
        font-size: 25px;
        font-weight: bold;
        cursor:pointer;
        transition: padding-top 1s,padding-bottom 1s,padding-right 1s,
        padding-left 1s;
        margin-right: 20px;

    }

    .numbers{
        background-color: green;
        color: white;
        border:none;
        padding-top: 8px;
        padding-bottom: 8px;
        padding-left: 15px;
        padding-right: 15px;
        margin-right: 10px;
        margin-left: 10px;
        font-weight: bold;
        transition: padding 0.15s,margin 0.15s;
        cursor:pointer;
    }

    .shadow{
        background-color: green;
        color:white;
        border: none;
        padding-top:10px;  
        padding-bottom:10px;  
        padding-left:15px;  
        padding-right:15px;  
        font-weight: bold;
        font-size: 15px; 
        box-shadow: 5px 5px 12px rgba(0, 0, 0, 0.548);
        transition:box-shadow 0.15s,margin 0.15s;

    }

    .pagination{
        padding-top: 15px;
        padding-bottom: 15px;
        padding-left: 15px;
        padding-right: 15px;
    }
    .num{
        margin: 10px;
    }

    .subscribe-button:hover{
        opacity: 0.8;
    }

    .subscribe-button:active{
        opacity: 0.5;
    }

    .join-button:hover{
        background-color: rgb(42, 87, 236);
        color:white;
    }

    .join-button:active{
        opacity:0.7;
    }

    .tweet-button:hover{
        box-shadow: 10px 10px 7px rgba(0, 0, 0, 0.404);
    }
    .tweet-button:active{
        opacity:0.7;
    }

    .stretch-button:hover{
        padding-bottom: 18px;
        padding-top: 18px;
        padding-left: 36px;
        padding-right: 36px;
    }

    .numbers:hover{
        padding-left: 25px;
        padding-right: 25px;
        margin-left: 0px;
        margin-right: 0px;
    }

    .shadow:active{
        margin-top: 3px;
        margin-left: 3px;
        box-shadow: none;
    }
